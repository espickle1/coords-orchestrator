[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coords-orchestrator"
version = "0.1.0"
description = "One reference frame for protein sequences, per-residue tables and structures: maps built once, holes made explicit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "biopython>=1.83",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
coords = "coords.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
